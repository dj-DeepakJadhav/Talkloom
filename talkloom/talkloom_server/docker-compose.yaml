services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: talkloom
      POSTGRES_PASSWORD: "9HOtNATDTNROTaTbPinsTK9-DaEaYAOS"
    volumes:
      - talkloom_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "nF5jyLXWupOTC7Cs_vb_mInn3KHBJuQO"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: talkloom_test
      POSTGRES_PASSWORD: "3q7qAfrHrvZx5LpvhEv3JWWc_UbJXaEG"
    volumes:
      - talkloom_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "5SwthGucoYspx1mH4eBzmwsKUJCrJesp"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  talkloom_data:
  talkloom_test_data:
