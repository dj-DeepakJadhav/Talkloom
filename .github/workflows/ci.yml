name: Talkloom CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true
      - name: Resolve workspace packages
        working-directory: talkloom
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: talkloom/talkloom_flutter
        run: flutter analyze
      - name: Test Flutter
        working-directory: talkloom/talkloom_flutter
        run: flutter test
      - name: Build Web release
        working-directory: talkloom/talkloom_flutter
        run: flutter build web --release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android debug APK
        working-directory: talkloom/talkloom_flutter
        run: flutter build apk --debug

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true
      - name: Resolve workspace packages
        working-directory: talkloom
        run: flutter pub get
      - name: Analyze Serverpod
        working-directory: talkloom/talkloom_server
        run: dart analyze
      # config/passwords.yaml is gitignored. Tests load the `test` section, so
      # create a throwaway one with random, CI-only values (never real secrets).
      - name: Create throwaway test passwords
        working-directory: talkloom/talkloom_server
        run: |
          {
            echo "test:"
            echo "  database: '$(openssl rand -hex 16)'"
            echo "  redis: '$(openssl rand -hex 16)'"
            echo "  emailSecretHashPepper: '$(openssl rand -hex 32)'"
            echo "  jwtHmacSha512PrivateKey: '$(openssl rand -hex 64)'"
            echo "  jwtRefreshTokenHashPepper: '$(openssl rand -hex 32)'"
          } > config/passwords.yaml
      - name: Test Serverpod
        working-directory: talkloom/talkloom_server
        run: dart test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate YouTube extractor runtime
        working-directory: talkloom/talkloom_server
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m py_compile scripts/extract_youtube.py
      - name: Build Serverpod container
        run: docker build -f talkloom/talkloom_server/Dockerfile -t talkloom-server:ci .

  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true
      - name: Resolve workspace packages
        working-directory: talkloom
        run: flutter pub get
      - name: Compile iOS without signing
        working-directory: talkloom/talkloom_flutter
        run: flutter build ios --debug --no-codesign
